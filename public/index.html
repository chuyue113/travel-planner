<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>團體旅遊協作平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">🧭</span>
    <div class="brand-text">
      <h1 id="tripTitle">團體旅遊協作平台</h1>
      <p class="sub" id="tripSub"></p>
    </div>
  </div>

  <div class="topbar-actions">
    <label class="field-inline" title="選擇你的身分">
      <span class="who-dot" id="meDot"></span>
      <select id="meSelect" aria-label="身分"></select>
    </label>
    <select id="langSelect" aria-label="Language">
      <option value="zh-Hant">繁體中文</option>
      <option value="zh-Hans">简体中文</option>
      <option value="en">English</option>
    </select>
    <button class="icon-btn" id="themeBtn" title="主題">🌗</button>
    <button class="icon-btn" id="settingsBtn" title="設定">⚙️</button>
    <span id="syncState" class="sync">—</span>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="主選單"></nav>

<main id="view" class="view"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="gateRoot"></div>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
